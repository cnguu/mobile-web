<!doctype html>
<html lang="">
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover<% } %>"
    />
    <meta
      name="description"
      content="<%= productDescription %>"
    />
    <meta
      name="keywords"
      content="vue"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="IE=edge,chrome=1"
    />
    <meta
      name="renderer"
      content="webkit"
    />
    <meta
      name="force-rendering"
      content="webkit"
    />
    <meta
      name="layoutmode"
      content="standard"
    />
    <meta
      name="browsermode"
      content="application"
    />
    <meta
      name="x5-page-mode"
      content="app"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-siteapp"
    />
    <meta
      http-equiv="Cache-Control"
      content="no-transform"
    />
    <meta
      name="mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />
    <meta
      name="theme-color"
      content="#1976d2"
    />
    <meta
      name="format-detection"
      content="telephone=no"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="icons/favicon-96x96.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link
      rel="icon"
      type="image/ico"
      href="favicon.ico"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-icon-180x180.png"
    />
  </head>
  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
